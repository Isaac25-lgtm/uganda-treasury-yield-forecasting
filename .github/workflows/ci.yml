name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]" -r dashboard/requirements.txt
      # Fixture, committed-aggregate consistency and AppTest dashboard tests only:
      # no source fetching, no PDF parsing of official files, no model training.
      - run: OMP_NUM_THREADS=2 R04_REQUIRE_DASHBOARD=1 pytest -q
